<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="flagRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="armGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Base with outer rings -->
  <!-- Outer Gold Border -->
  <circle cx="100" cy="100" r="96" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  <!-- Outer Red Ring -->
  <circle cx="100" cy="100" r="92" fill="#dc2626" />
  <!-- Inner White Ring -->
  <circle cx="100" cy="100" r="88" fill="#ffffff" />

  <!-- Shield Base (Xanh lá Đoàn) -->
  <path
    d="M 100 16 
       C 152 16 182 45 182 92
       C 182 145 140 178 100 186
       C 60 178 18 145 18 92
       C 18 45 48 16 100 16 Z"
    fill="url(#shieldGrad)"
    stroke="#facc15"
    stroke-width="3"
  />

  <!-- Ray lines on green shield -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="100" y1="92" x2="35" y2="40" />
    <line x1="100" y1="92" x2="60" y2="25" />
    <line x1="100" y1="92" x2="100" y2="20" />
    <line x1="100" y1="92" x2="140" y2="25" />
    <line x1="100" y1="92" x2="165" y2="40" />
    <line x1="100" y1="92" x2="175" y2="70" />
    <line x1="100" y1="92" x2="25" y2="70" />
  </g>

  <!-- Flagpole (Cán cờ) -->
  <!-- Angle approx 42 deg from bottom left to top right -->
  <path
    d="M 52 148 L 136 34"
    stroke="url(#poleGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <!-- Flagpole tip spear -->
  <polygon points="135,31 140,24 144,33 138,36" fill="#facc15" stroke="#b45309" stroke-width="0.8" />

  <!-- Flag (Lá cờ đỏ phấp phới tung bay) -->
  <path
    d="M 134 36
       C 115 32, 95 44, 75 38
       C 65 35, 58 39, 58 39
       L 62 90
       C 80 84, 102 96, 120 90
       C 126 88, 130 84, 130 84
       Z"
    fill="url(#flagRedGrad)"
    stroke="#b91c1c"
    stroke-width="1.2"
    filter="url(#shadowFilter)"
  />

  <!-- Gold Star on Flag -->
  <!-- Star center approx (92, 62) -->
  <polygon
    points="92,48 95,57 104,57 97,63 100,72 92,66 84,72 87,63 80,57 89,57"
    fill="url(#goldStar)"
    stroke="#ca8a04"
    stroke-width="0.8"
    filter="url(#shadowFilter)"
  />

  <!-- Arm holding flagpole (Cánh tay vững chắc nắm cán cờ) -->
  <g filter="url(#shadowFilter)">
    <!-- Forearm extending from bottom left -->
    <path
      d="M 28 162
         C 40 148, 55 132, 70 120
         C 75 116, 82 121, 88 126
         C 74 140, 56 160, 42 174
         Z"
      fill="url(#armGrad)"
      stroke="#b91c1c"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Fist clenching the pole -->
    <path
      d="M 68 114
         C 72 108, 82 104, 90 110
         C 95 114, 94 122, 90 128
         C 84 134, 74 132, 70 124
         Z"
      fill="url(#armGrad)"
      stroke="#b91c1c"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Fingers details -->
    <path d="M 76 112 C 80 115, 84 117, 88 120" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 72 118 C 77 121, 81 123, 85 126" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 70 124 C 74 126, 78 128, 81 131" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Ribbon at bottom (Dải lụa chữ THANH NIÊN VIỆT NAM) -->
  <g filter="url(#shadowFilter)">
    <!-- Ribbon background -->
    <path
      d="M 32 154
         C 65 174, 135 174, 168 154
         L 165 170
         C 133 190, 67 190, 35 170
         Z"
      fill="#ffffff"
      stroke="#dc2626"
      stroke-width="2"
    />
    <!-- Ribbon ends fold -->
    <path d="M 32 154 L 24 162 L 35 170 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="1" />
    <path d="M 168 154 L 176 162 L 165 170 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="1" />

    <!-- Ribbon text path -->
    <path
      id="textArc"
      d="M 36 169 C 70 185, 130 185, 164 169"
      fill="none"
      stroke="none"
    />
    <text font-family="'Arial', 'Segoe UI', sans-serif" font-weight="900" font-size="9" fill="#dc2626" letter-spacing="1">
      <textPath href="#textArc" startOffset="50%" text-anchor="middle">
        THANH NIÊN VIỆT NAM
      </textPath>
    </text>
  </g>
</svg>
