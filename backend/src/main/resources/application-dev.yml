spring:
  application:
    name: quiz-competition

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quiz_database}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 500ms           # read/write timeout — fail fast to in-memory
      connect-timeout: 500ms   # connection timeout — fail fast when Redis not running

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:ChonMotChuoiThatDaiVaBiMatTren64KyTuDeDamBaoAnToanTuyetDoiChoHeThongQuiz1234}
  expiration-ms: 28800000  # 8 hours

quiz:
  exam:
    mc-question-count: 10
  otp:
    emergency-master-otp: "123456"

logging:
  level:
    com.quiz: INFO
    org.springframework.security: WARN
    org.springframework.web: TRACE
